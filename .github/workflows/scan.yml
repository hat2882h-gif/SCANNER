name: scan-market
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python scan_market.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add market.csv
          git commit -m "update market" || echo "no changes"
          git push
